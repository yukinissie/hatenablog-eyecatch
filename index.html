<!DOCTYPE html>
<html lang="{BlogLanguage}">
  <!-- ここで BlogLanguage を指定すると言語を指定することができます -->
  <!-- 言語に適した改行の処理に影響があるため指定を推奨します -->
  <head>
    <meta charset="utf-8">
    <style>
      :root{
        --bg-main: #1a1a1a;
        --bg-secondary: #0d1117;
        --text-main: #e6edf3;
        --text-back: #21262d;
        --content-rounded: 12px;
        --background-image: url('./background.jpg');
      }
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-secondary);
        background-image: var(--background-image);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: var(--text-main);
        font-weight: normal;
        font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', monospace;
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 24px 24px;
        line-height: 1.4;
        word-break: break-word;
      }

      /* カテゴリによるカスタマイズ */
      /* 後述の通り、変数を使ってカテゴリのclassを付与すると
      カテゴリごとにデザインをカスタマイズすることができます */
      body.category-tech {
        --bg-main: #1e1e1e;
        --bg-secondary: #0a0a0a;
        --text-main: #00ff00;
        --text-back: #2a2a2a;
      }
      body.category-programming {
        --bg-main: #1a1a2e;
        --bg-secondary: #16213e;
        --text-main: #ff6b6b;
        --text-back: #0f3460;
      }

      /* コンテンツ部分の共通設定 */
      body > div {
        background-color: var(--bg-main);
      }
      body > div:first-child {
        border-radius: var(--content-rounded) var(--content-rounded) 0 0;
      }
      body > div:last-child {
        border-radius: 0 0 var(--content-rounded) var(--content-rounded);
      }

      /* ヘッダの設定 */
      .header {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 18px;
      }
      .header > :first-child {
        margin-left: 24px;
      }
      .header > :last-child {
        margin-right: 24px;
      }
      .header .base {
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      .icon > svg, .icon > img {
        border-radius: 50%;
        width: 64px;
        margin-right: 12px;
      }
      .blog-title {
        max-width: 60%;
      }
      .blog-title .title {
        font-size: 48px;
        font-weight: bold;
        color: var(--text-main);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .spacer {
        flex-grow: 1;
      }
      .category {
        display: flex;
        justify-content: center;
        gap: 15px;
        max-width: 25%;
      }
      .category span {
        display: block;
        box-sizing: border-box;
        padding: 2px 12px;
        border-radius: 8px;
        background-color: var(--text-back);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 30px;
        line-height: 1.3;
        font-weight: bold;
        color: var(--text-main);
      }
      .category span:empty {
         display:none;
      }

      /* メインコンテンツの設定 */
      .main-wrapper {
        flex: 1;
        width: 100%;
        display:flex;
        padding-bottom: 56px; /* Xのシェア時には、アイキャッチの下部に
        タイトル要素が重ねて表示されるため空白を用意しておくことを推奨します */
      }
      .main {
        width: 75%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 20px auto 8px;
        overflow: hidden;
        text-align: center;
      }
      .entry-title {
        display: -webkit-box;
        -webkit-line-clamp: 4; /* 行数の上限 */
        line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap : break-word;
        word-break: auto-phrase;
        color: var(--text-main);
        font-size: 56px;
        line-height: 1.3;
        font-weight: bold;
      }
    </style>
  </head>
  <body class="category-{FirstCategory}">
    <!-- 上記のようにclassを指定することで、例えばある特定のカテゴリのみ
    背景色や文字色の変更などデザインを変更する、という調整を行うことができます -->
    <div class="header">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 24 24" fill="#e6edf3">
          <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0L19.2 12l-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
          <path d="M14.5 2L9.5 22h1.5l5-20h-1.5z"/>
        </svg>
        <!-- SVGかbase64化した画像のみ挿入することが可能です -->
      </div>
      <div class="blog-title">
        <div class="title">{BlogTitle}</div>
      </div>
      <div class="spacer"></div>
      <div class="category">
        <span>{FirstCategory}</span>
      </div>
    </div>
    <div class="main-wrapper">
      <div class="main">
        <div class="entry-title">{Title}</div>
      </div>
    </div>
  </body>
</html>
